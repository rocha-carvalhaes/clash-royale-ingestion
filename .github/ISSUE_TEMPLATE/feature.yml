name: Feature
description: Funcionalidade nova ou evolução do pipeline
type: Feature
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual problema ou necessidade isto resolve?
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Critério de pronto
      description: Checklist verificável.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: impacto
    attributes:
      label: Impacto
      description: Dados, schema, custo, cron, painel.
